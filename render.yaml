# Render Blueprint — free public deployment.
# Create the service from this file (Render dashboard → New → Blueprint), then set
# the secret env vars (marked sync:false) in the dashboard.
services:
  - type: web
    name: anvitech-ppc-duplicate
    runtime: python
    plan: free
    autoDeploy: true          # deploy automatically on every push to the tracked branch (main)
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    # Login credentials are baked into api/auth.py and work with no env vars set.
    # Set any of these to OVERRIDE a baked-in value without a code change.
    envVars:
      - key: ADMIN_USERNAME         # overrides the baked admin username (optional)
        sync: false
      - key: ADMIN_PASSWORD         # overrides the baked admin password (optional)
        sync: false
      - key: USER_USERNAME          # overrides the baked user username (optional)
        sync: false
      - key: USER_PASSWORD          # overrides the baked user password (optional)
        sync: false
      - key: SESSION_SECRET         # optional; else a random secret is generated + stored
        sync: false
      - key: UPSTASH_REDIS_REST_URL # from the Upstash console (durable storage)
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # --- This deployment's OWN database (read/write). A separate cluster from
      # the live site's — nothing here is shared with it.
      - key: MONGODB_URI
        sync: false
      # --- The LIVE site's database, read-only. Setting this turns this
      # deployment into a mirror: daily entries and orders recorded on the real
      # site show up here automatically, and nothing done here can reach it.
      # MUST be the connection string of a read-only Atlas user. Leave unset to
      # run as a plain standalone copy. See engine/overlay_store.py.
      - key: UPSTREAM_MONGODB_URI
        sync: false
      # Seconds to cache live-site reads. Lower = fresher, more cross-cluster
      # round trips. Default 30.
      - key: UPSTREAM_CACHE_TTL
        value: "30"
      # --- Cloud Optimize (GitHub Actions) -------------------------------- #
      # The full contest runs on a GitHub runner instead of Render's 0.1 CPU.
      # Needs BOTH of the next two set, or Optimize just computes locally.
      # A fine-grained PAT with Actions: read+write on THIS repo only.
      - key: GITHUB_DISPATCH_TOKEN
        sync: false
      # Shared secret the workers authenticate back with. Must equal the
      # GitHub repo secret OPTIMIZE_WORKER_SECRET. Use a NEW value — not the
      # live site's, or its workers could post results here and vice versa.
      - key: OPTIMIZE_WORKER_SECRET
        sync: false
      # Which repo to dispatch into. Defaults to this duplicate's own repo;
      # api/main.py REFUSES the mirrored repo outright, so a mistake here
      # cannot fire a contest in the live site's repo.
      - key: GITHUB_REPO
        value: riittiin/anvitech-ppc-duplicate
      # 0 = go straight to GitHub Actions. The live site waits ~3 min for its
      # always-on Oracle box to claim the job first; this duplicate has no such
      # box, so waiting would just add 3 idle minutes to every run.
      - key: ORACLE_CLAIM_TIMEOUT_MIN
        value: "0"
      # Run the new operator-stable engine in production. The code default is 'classic'
      # (kept for the test suite that validates that engine); this makes the deployed app
      # use the new engine unless an admin explicitly picks another in Settings.
      #
      # This is the SAME engine the live site runs, on purpose: same engine, same
      # plans, its own database is what makes this deployment a fair mirror. Two
      # alternative engines were built here and BOTH have been removed from the tree
      # (2026-08-15); the record is kept here because the code that produced it is gone.
      #
      #   cp_engine (CP-SAT, 2026-08-14) — worked end to end: dispatch, solve, return,
      #   score and the apply gate were all verified on the owner's real book. It lost
      #   on merit: 726 late-days against the applied plan's 671, so the gate correctly
      #   refused it, and two earlier runs spent their whole budget just reaching a
      #   first feasible schedule. It searches from a blank sheet with no knowledge
      #   that a current plan exists, so it can return something worse. Warm-starting
      #   from the applied plan (CPModel.solve(initial_solution=)) is what would fix
      #   that, and it was never built. Nor was a makespan term.
      #
      #   roster_engine (roster-first, 2026-08-12) — never deployed.
      #
      # Also removed: four 2026-08-12 scheduler changes to ppc_engine (parallel batch
      # splitting, the per-machine booking calendar, and partial-window staffing). The
      # calendar made every trial placement rewind to the plan start and walk forward
      # hunting for a hole, which cost 4x the wall clock per plan — measured 1.62 s vs
      # the live site's 0.41 s on the same book — for a plan the search could no longer
      # afford to look for. Both engines and all of that work remain in git history and
      # on their own branches.
      - key: DEFAULT_SCHEDULER
        value: new
