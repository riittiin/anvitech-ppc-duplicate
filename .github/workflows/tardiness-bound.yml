# How good could the plan POSSIBLY be?
#
# Read-only diagnostic. Plans nothing, applies nothing, writes nothing — it only
# reads the book and asks a constraint solver for a PROVEN FLOOR on late-days, so
# we can tell whether the plan is near-optimal or whether the engine simply
# cannot see a better one.
#
# With seed_engine on (the default) it goes one step further: it hands the
# solver's JOB ORDER to the real engine as a starting sequence, re-plans under all
# four shop rules, and prints engine-alone vs engine-seeded vs the CP target — so
# the answer is "how much of the gap is reachable", not just "a gap exists". The
# replay uses pipeline.run_forward with priority_rank, the app's own replay path,
# and the result is PRINTED only: no ranks are saved and no plan is applied.
#
# Manual only (workflow_dispatch). Nothing about the live app changes; this
# workflow is additive and no existing file was touched to add it.
#
# Needs TWO repo secrets, both copied from the duplicate's Render service:
#   MONGODB_URI           the duplicate's own cluster (masters, config, operators)
#   UPSTREAM_MONGODB_URI  the live cluster, READ-ONLY — where the ORDERS come from
# The duplicate mirrors the live book through an OverlayStore (engine/overlay_store.py),
# so without the second one the book has masters but no orders and the run is useless.
# The script only ever reads.
name: Tardiness lower bound

on:
  workflow_dispatch:
    inputs:
      level:
        description: "machines = loosest+fastest | operators = tighter (nobody in two places at once)"
        required: true
        default: machines
        type: choice
        options: [machines, operators]
      time_limit:
        description: "Solver seconds"
        required: true
        default: "600"
        type: string
      horizon_days:
        description: "Days of schedule to model. Smaller = far less memory. Raise only if it says the horizon is too short."
        required: true
        default: "70"
        type: string
      seed_engine:
        description: "Also hand the solver's job order to the REAL engine, re-plan under all four rules, and print the comparison. Still read-only — applies nothing."
        required: false
        default: true
        type: boolean
      seed_search_evals:
        description: "With seed_engine: also run the app's own sequence+crew search opened on the solver's order, for this many plans (0 = off)."
        required: false
        default: "0"
        type: string

jobs:
  bound:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        # pyjobshop is NOT added to requirements.txt on purpose — it is a
        # solver-only dependency and must never reach the Render service, which
        # runs the REPLAY path (cp_engine domain/windows/genome/decode/report)
        # and has neither pyjobshop nor ortools installed. A test pins that those
        # modules import without them.
        #
        # PINNED, deliberately. The cp_engine design reaches pyjobshop's internal
        # API — CPModel(data).model / .variables / assign_vars — because Rule 1's
        # per-shift roster and the fairness objective cannot be expressed in the
        # public one. Verified against 0.0.9; tests/test_cp_escape_hatch.py is the
        # canary that fails loudly if an upgrade moves it.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyjobshop==0.0.9

      - name: Compute the floor
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          UPSTREAM_MONGODB_URI: ${{ secrets.UPSTREAM_MONGODB_URI }}
          UPSTREAM_CACHE_TTL: "3600"
        run: |
          python scripts/tardiness_bound.py \
            --level "${{ inputs.level }}" \
            --time-limit "${{ inputs.time_limit }}" \
            --horizon-days "${{ inputs.horizon_days }}" \
            ${{ inputs.seed_engine && '--seed-engine' || '' }} \
            --seed-search-evals "${{ inputs.seed_search_evals || 0 }}" \
            2>&1 | tee bound.txt

      - name: Summary
        if: always()
        run: |
          {
            echo '## Tardiness lower bound'
            echo ''
            echo '```'
            # 40 lines cut the --seed-engine comparison table off the top: the
            # "HOW TO READ THIS" block below it is 16 lines on its own.
            tail -90 bound.txt 2>/dev/null || echo 'no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tardiness-bound
          path: bound.txt
